services:

  gateway-php:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-php
    restart: unless-stopped

  gateway-nginx:
    image: nginx:alpine
    container_name: gateway-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway-service:/var/www/api-gateway:ro
      - ./gateway-service/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway-php

  db:
    image: mysql:8.0
    container_name: banque_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: banque
      MYSQL_USER: banque
      MYSQL_PASSWORD: banque
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: