# Configuration commune des services Symfony (remplace le .env, non versionné)
x-symfony-env: &symfony-env
  APP_ENV: dev
  APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
  DEFAULT_URI: http://localhost
  DB_DSN: "mysql:host=db;port=3306;dbname=banque;charset=utf8mb4"
  DB_USER: banque
  DB_PASSWORD: banque

services:

  gateway-php:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-php
    restart: unless-stopped
    environment:
      JWT_SECRET: "super_secret_key_that_is_at_least_32_bytes_long_for_hs256"
    volumes:
      - ./gateway-service:/var/www/api-gateway
      - /var/www/api-gateway/vendor

  gateway-nginx:
    image: nginx:alpine
    container_name: gateway-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway-service:/var/www/api-gateway
      - ./gateway-service/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway-php

  compte-php:
    build:
      context: ./compte-service
      dockerfile: Dockerfile
    container_name: compte-php
    restart: unless-stopped
    environment:
      <<: *symfony-env
    depends_on:
      - db
    volumes:
      - ./compte-service:/var/www/compte-service
      - /var/www/compte-service/vendor

  compte-nginx:
    image: nginx:alpine
    container_name: compte-nginx
    restart: unless-stopped
    volumes:
      - ./compte-service:/var/www/compte-service:ro
      - ./compte-service/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - compte-php

  client-php:
    build:
      context: ./client-service
      dockerfile: Dockerfile
    container_name: client-php
    restart: unless-stopped
    environment:
      <<: *symfony-env
    depends_on:
      - db
    volumes:
      - ./client-service:/var/www/client-service
      - /var/www/client-service/vendor

  client-nginx:
    image: nginx:alpine
    container_name: client-nginx
    restart: unless-stopped
    volumes:
      - ./client-service:/var/www/client-service:ro
      - ./client-service/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client-php

  transaction-php:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    container_name: transaction-php
    restart: unless-stopped
    environment:
      <<: *symfony-env
      COMPTE_SERVICE_URL: http://compte-nginx:80
    depends_on:
      - db
    volumes:
      - ./transaction-service:/var/www/transaction-service
      - /var/www/transaction-service/vendor

  transaction-nginx:
    image: nginx:alpine
    container_name: transaction-nginx
    restart: unless-stopped
    volumes:
      - ./transaction-service:/var/www/transaction-service:ro
      - ./transaction-service/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - transaction-php

  auth-php:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-php
    restart: unless-stopped
    depends_on:
      - db
    environment:
      <<: *symfony-env
      JWT_SECRET: "super_secret_key_that_is_at_least_32_bytes_long_for_hs256"
    volumes:
      - ./auth-service:/var/www/auth-service
      - /var/www/auth-service/vendor

  auth-nginx:
    image: nginx:alpine
    container_name: auth-nginx
    restart: unless-stopped
    volumes:
      - ./auth-service:/var/www/auth-service:ro
      - ./auth-service/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-php

  front:
    build:
      context: ./front-service
      dockerfile: Dockerfile
    container_name: front
    restart: unless-stopped
    ports:
      - "3000:80"

  db:
    image: mysql:8.0
    container_name: banque_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: banque
      MYSQL_USER: banque
      MYSQL_PASSWORD: banque
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: banque_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  mysql_data: